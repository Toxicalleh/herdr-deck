<svg xmlns="http://www.w3.org/2000/svg" width="144" height="144" viewBox="0 0 144 144">
  <defs>
    <clipPath id="c-login"><rect width="144" height="144" rx="24" ry="24"/></clipPath>
    <filter id="g-login" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g clip-path="url(#c-login)">
    <rect width="144" height="144" fill="#17131e"/>
    <circle cx="126" cy="18" r="38" fill="#ffffff" opacity="0.06"/>
    
    <rect x="0" y="0" width="144" height="17" fill="#ffb52e"/>
    <text x="72" y="12.5" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="900" fill="#17131e" letter-spacing="2">CLAUDE</text>
    <text x="72" y="72" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900" fill="#ffb52e" letter-spacing="1.2">LOG IN</text>
    <text x="72" y="98" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" opacity="0.8">run claude, then /login</text>
    <text x="72" y="114" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" opacity="0.6">on the server</text>
    <rect width="144" height="144" rx="24" ry="24" fill="none" stroke="#ffb52e" stroke-opacity="0.4" stroke-width="3"/>
  </g>
</svg>