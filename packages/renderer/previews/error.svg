<svg xmlns="http://www.w3.org/2000/svg" width="144" height="144" viewBox="0 0 144 144">
  <defs>
    <clipPath id="c-error"><rect width="144" height="144" rx="24" ry="24"/></clipPath>
    <filter id="g-error" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g clip-path="url(#c-error)">
    <rect width="144" height="144" fill="#17111a"/>
    <circle cx="126" cy="18" r="38" fill="#ffffff" opacity="0.06"/>
    
    <text x="72" y="34" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#ffffff" letter-spacing="1.1">HERDR</text>
    <text x="72" y="66" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="900" fill="#ff6b2b" letter-spacing="1.2">OFFLINE</text>
    <text x="72" y="92" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" opacity="0.75">ssh: connect to</text>
    <text x="72" y="106" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" opacity="0.75">host my-server:</text>
    <text x="72" y="120" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" fill="#ffffff" opacity="0.75">Connection refused</text>
    <rect width="144" height="144" rx="24" ry="24" fill="none" stroke="#ff6b2b" stroke-opacity="0.4" stroke-width="3"/>
  </g>
</svg>